<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#093000">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="../assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <title>Domare · Boulekampen</title>
  <link rel="stylesheet" href="../app/ui.css">
  <style>
    html, body { overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 640px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .bar .logo { width: 44px; flex-shrink: 0; }
    .bar .court {
      font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .bar .court button { font-size: 12px; font-family: var(--body); text-transform: none; font-weight: normal; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .sync { font-size: 12px; }

    .center { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .pin-box { text-align: center; }
    .pin-box h1 { font-size: clamp(26px, 8vw, 40px); }
    .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 28px 0; }
    .pin-dots i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); transition: background 0.2s, transform 0.3s var(--spring); }
    .pin-dots i.on { background: var(--hi); box-shadow: none; transform: scale(1.15); }
    .pin-dots.shake { animation: shake 0.4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; }
    .keypad button {
      height: 64px; border-radius: 18px; background: var(--raise);
      font-family: var(--display); font-weight: 700; font-size: 24px;
      transition: background 0.15s, transform 0.15s;
    }
    .keypad button:active { background: var(--hi); color: var(--bg); transform: scale(0.95); }

    .courts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 18px; }
    .courts button {
      aspect-ratio: 1; border-radius: 20px; background: var(--raise);
      display: grid; place-items: center; align-content: center; gap: 2px;
      transition: background 0.2s, transform 0.2s var(--ease);
    }
    .courts button:hover { background: var(--raise-2); }
    .courts button:active { transform: scale(0.95); }
    .courts b { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
    .courts span { font-size: 12px; color: var(--muted); }
    .courts button.live b { color: var(--hi); }

    /* Poängtavlan */
    .title { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .board { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; flex: 1; min-height: 360px; }
    @media (orientation: landscape) and (max-height: 560px) { .board { grid-template-rows: none; grid-template-columns: 1fr 1fr; min-height: 220px; } }
    .half {
      position: relative;
      border-radius: 24px;
      background: var(--raise);
      padding: 16px 18px;
      display: flex; flex-direction: column; justify-content: space-between;
      text-align: left;
      overflow: hidden;
      transition: background 0.25s, transform 0.2s var(--ease);
      touch-action: manipulation;
    }
    .half:active { transform: scale(0.985); }
    .half .tn { font-size: 17px; line-height: 1.2; max-width: 80%; }
    .half .big {
      font-family: var(--display); font-weight: 800;
      font-size: clamp(88px, 30vw, 170px); line-height: 0.85;
      align-self: flex-end; font-variant-numeric: tabular-nums;
    }
    .half .hint { font-size: 12px; color: var(--faint); }
    .half.lead .big { color: var(--hi); }
    .half.flash { animation: flash 0.6s var(--ease); }
    @keyframes flash { 0% { background: var(--hi); color: var(--bg); } 100% { background: var(--raise); } }
    .half.win { background: var(--hi); color: var(--bg); }
    .half.win .big, .half.win .hint { color: var(--bg); }
    .half[disabled] { opacity: 0.5; pointer-events: none; }

    .ends { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; min-height: 44px; }
    .ends::-webkit-scrollbar { display: none; }
    .end-chip { flex-shrink: 0; padding: 5px 10px; border-radius: 99px; background: var(--raise); font-size: 13px; animation: chip-in 0.35s var(--spring); }
    .end-chip b { font-family: var(--display); }
    @keyframes chip-in { from { transform: scale(0.6); opacity: 0; } }

    .tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .tools .btn { flex: 1; }

    /* Poängväljaren */
    .sheet-bg { position: fixed; inset: 0; background: rgba(3, 18, 0, 0.7); opacity: 0; transition: opacity 0.25s; z-index: 50; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
      background: var(--bg);
      box-shadow: 0 -1px 0 var(--line), 0 -20px 60px rgba(0,0,0,.4);
      border-radius: 26px 26px 0 0;
      padding: 22px 18px max(22px, env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.4s var(--ease);
      max-width: 640px; margin: 0 auto;
    }
    .sheet.open { transform: none; }
    .sheet-bg.open { opacity: 1; }
    .sheet h2 { font-size: 16px; margin-bottom: 4px; }
    .sheet p { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
    .pts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pts button {
      height: 76px; border-radius: 20px; background: var(--raise);
      font-family: var(--display); font-weight: 800; font-size: 32px;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .pts button:active, .pts button:hover { background: var(--hi); color: var(--bg); }
    .pts button:active { transform: scale(0.94); }

    .next-list { margin-top: 18px; }
    .next-list h3 { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .timer { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--hi); font-variant-numeric: tabular-nums; }
    .timer.out { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }

    .done-box { text-align: center; padding: 30px 0 10px; }
    .done-box .num { font-size: 64px; color: var(--hi); line-height: 1; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="demo"></div>
  <div class="wrap" id="app"></div>
  <div class="sheet-bg" id="sheet-bg" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <h2 id="sheet-title"></h2>
    <p>Hur många klot låg närmast lillen?</p>
    <div class="pts">
      <button data-p="1">1</button><button data-p="2">2</button><button data-p="3">3</button>
      <button data-p="4">4</button><button data-p="5">5</button><button data-p="6">6</button>
    </div>
    <button class="btn ghost block" style="margin-top:14px" data-sheet-close>Avbryt</button>
  </div>
  <script type="module" src="domare.js"></script>
</body>
</html>
