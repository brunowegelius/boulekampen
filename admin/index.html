<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#093000">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <title>Arrangör · Boulekampen</title>
  <link rel="stylesheet" href="../app/ui.css">
  <style>
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px var(--pad);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
    }
    .top .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .top .brand .logo { width: 52px; }
    .top .brand span { font-family: var(--display); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); min-width: 0; }
    .crumbs a { text-decoration: none; color: var(--muted); }
    .crumbs a:hover { color: var(--ink); }
    .crumbs b { font-weight: normal; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main { max-width: 1180px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) var(--pad) 120px; }

    .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
    .hero h1 { max-width: 16ch; overflow-wrap: anywhere; }
    .hero .sub { margin-top: 10px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

    .tabs-wrap { margin-bottom: 26px; position: sticky; top: 81px; z-index: 10; padding: 8px 0; background: var(--bg); }

    /* Hem */
    .home-grid { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 980px) { .home-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
    .list-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: center;
      padding: 16px 4px;
      border-top: 1px solid var(--line);
      text-decoration: none;
      transition: padding 0.3s var(--ease), background 0.3s;
      border-radius: 4px;
    }
    .list-row:hover { padding-left: 14px; background: var(--raise); }
    .list-row .name { font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; }
    .list-row .meta { grid-column: 1; font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .list-row .go { grid-row: 1 / span 2; grid-column: 2; transition: transform 0.3s var(--ease); }
    .list-row:hover .go { transform: translateX(4px); }

    .pipeline { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .lane h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .lane .card {
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--raise);
      text-decoration: none;
      margin-bottom: 8px;
      transition: transform 0.3s var(--ease), background 0.2s;
    }
    .lane .card:hover { transform: translateY(-2px); background: var(--raise-2); }
    .lane .card b { display: block; font-weight: normal; }
    .lane .card span { font-size: 12px; color: var(--muted); }
    .lane .none { font-size: 13px; color: var(--faint); padding: 10px 2px; }

    /* Översikt */
    .ov { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .ov { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
    .bigstats { display: flex; gap: clamp(20px, 5vw, 56px); flex-wrap: wrap; }
    .bigstats div { display: grid; }
    .bigstats .num { font-size: clamp(34px, 5vw, 56px); line-height: 1; color: var(--hi); }
    .bigstats span:last-child { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .links { display: grid; gap: 10px; }
    .link-card { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; padding: 10px; border-radius: 12px; background: rgba(0,0,0,.12); }
    .link-card .qr { width: 72px; }
    .link-card b { font-family: var(--display); font-size: 13px; text-transform: uppercase; font-weight: 700; }
    .link-card .u { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .link-card .row { margin-top: 6px; }
    .progress { height: 6px; border-radius: 99px; background: var(--raise-2); overflow: hidden; margin-top: 18px; }
    .progress i { display: block; height: 100%; background: var(--hi); border-radius: 99px; transition: width 0.8s var(--ease); }

    /* Lagtabell */
    .ed-table { width: 100%; border-collapse: collapse; }
    .ed-table th { text-align: left; font-weight: normal; font-size: 12px; color: var(--faint); padding: 0 6px 8px; white-space: nowrap; }
    .ed-table td { padding: 6px; border-top: 1px solid var(--line); vertical-align: middle; }
    .ed-table .input { min-height: 38px; padding: 7px 10px; font-size: 14px; }
    .ed-table select.input { padding-right: 30px; }
    .ed-table .w-name { min-width: 170px; }
    .ed-table .w-sm { width: 74px; }
    .scroll-x { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    .ed-table tr { transition: background 0.2s; }
    .ed-table tbody tr:hover { background: var(--raise); }

    /* Schema */
    .slot { margin-bottom: 26px; }
    .slot-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
    .slot-head .num { font-size: 22px; color: var(--hi); }
    .slot-head .muted { font-size: 13px; }
    .match.admin { cursor: pointer; border-radius: 8px; transition: background 0.2s; padding-left: 8px; padding-right: 8px; }
    .match.admin:hover { background: var(--raise); }

    .groups-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }

    .fmt-options { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 18px; }
    .fmt {
      text-align: left;
      padding: 16px;
      border-radius: 14px;
      box-shadow: inset 0 0 0 1.5px var(--line);
      transition: box-shadow 0.2s, background 0.2s, transform 0.3s var(--ease);
    }
    .fmt:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
    .fmt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--hi); background: var(--hi-soft); }
    .fmt b { display: block; font-family: var(--display); text-transform: uppercase; font-size: 13px; margin-bottom: 6px; }
    .fmt span { font-size: 13px; color: var(--muted); }

    .est { display: flex; gap: 22px; flex-wrap: wrap; padding: 14px 16px; border-radius: 12px; background: rgba(0,0,0,.14); margin-top: 16px; }
    .est div { display: grid; }
    .est .num { font-size: 22px; }
    .est span:last-child { font-size: 12px; color: var(--muted); }

    /* Offert */
    .items td .input { min-width: 70px; }
    .totals { margin-left: auto; width: min(100%, 320px); margin-top: 14px; }
    .totals div { display: flex; justify-content: space-between; padding: 6px 0; }
    .totals .sum { border-top: 1.5px solid var(--ink); font-family: var(--display); font-weight: 800; margin-top: 4px; padding-top: 10px; }

    .check-list { display: grid; gap: 2px; }
    .check-list label.check { padding: 10px 8px; border-radius: 8px; width: 100%; transition: background 0.2s; }
    .check-list label.check:hover { background: var(--raise); }
    .check-list input:checked ~ span.t { color: var(--faint); text-decoration: line-through; }

    .runsheet { font-variant-numeric: tabular-nums; }
    .runsheet div { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .runsheet div b { font-family: var(--display); font-weight: 700; color: var(--hi); }

    .login { max-width: 420px; margin: 12vh auto 0; text-align: center; }
    .login .logo { width: 160px; margin: 0 auto 28px; }
    .login form { display: grid; gap: 12px; margin-top: 24px; text-align: left; }

    /* Utskrift: offert och diplom */
    #print { display: none; }
    @media print {
      @page { margin: 16mm; }
      body > *:not(#print) { display: none !important; }
      #print { display: block; color: #000; font-family: var(--body); }
      #print .doc h1 { color: #093000; font-size: 30px; }
      #print .doc table { width: 100%; border-collapse: collapse; margin-top: 18px; }
      #print .doc th, #print .doc td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #ccc; font-size: 12pt; }
      #print .doc td.r, #print .doc th.r { text-align: right; }
      #print .doc .logo { width: 110px; background: #093000; }
      #print .dip {
        page-break-after: always;
        height: 250mm;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        border: 3px solid #093000; border-radius: 12px; padding: 20mm;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      #print .dip .logo { width: 70mm; background: #093000; margin-bottom: 12mm; }
      #print .dip .place { font-family: var(--display); font-weight: 800; font-size: 64pt; color: #093000; line-height: 1; }
      #print .dip .team { font-family: var(--display); font-weight: 700; font-size: 26pt; text-transform: uppercase; margin-top: 8mm; }
      #print .dip .who { font-size: 14pt; margin-top: 6mm; }
      #print .dip .ev { font-size: 12pt; margin-top: 14mm; color: #333; }
    }
  </style>
</head>
<body>
  <div id="demo"></div>
  <header class="top no-print">
    <a class="brand" href="#/"><i class="logo" aria-hidden="true"></i><span>Arrangör</span></a>
    <nav class="crumbs" id="crumbs" aria-label="Du är här"></nav>
    <div id="who" class="row"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="print"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
